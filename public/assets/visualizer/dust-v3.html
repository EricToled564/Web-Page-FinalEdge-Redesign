<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dust Particle Visualizer</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0E0E12;
    overflow:hidden; -webkit-tap-highlight-color: transparent;
  }
  #app { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/assets/js/three.module.min.js"
  }
}
</script>
<script type="module">
/* ============================================================
 *  Dust particle visualizer — Three.js Points + custom shader.
 *  ~22k particles in an organic distribution, driven by curl
 *  noise and audio-reactive amplitudes with per-beat pulse.
 *
 *  ADAPTADO 2026-07-18: sin UI propia (upload/play/stop/HUD) —
 *  vive en un <iframe> MISMO-ORIGEN dentro de /servicios/[slug]
 *  y lo controla la página madre a través de dos funciones
 *  expuestas en window: dustPlay(url) y dustStop(). El arranque
 *  y el final del efecto quedan atados 1:1 a source.onended, tal
 *  como pidió el cliente ("inicia con la canción, termina con
 *  ella"). Los eventos de estado (started/ended/error) se avisan
 *  a la página madre vía postMessage porque la llamada de origen
 *  (click en una pista) ocurre en la página madre, no aquí.
 * ============================================================ */
import * as THREE from 'three';

const notifyParent = (msg) => { try { parent.postMessage(msg, '*'); } catch (_) {} };

// -------- Scene setup --------
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
/* mismo fondo que la página madre (--bg #0E0E12, pedido 2026-07-18: el
   polvo debe flotar directo sobre el fondo, sin recuadro visible) */
renderer.setClearColor(0x0e0e12, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0e0e12, 0.045);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 8);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
});

// -------- Particle geometry --------
const N = 22000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);
/* nube horizontal, centrada verticalmente (pedido 2026-07-18: era una
   columna vertical, se pide ancha) — el estiramiento pasa del eje Y al
   eje X; la media de cada eje sigue en 0, así que el centro no se mueve. */
for (let i = 0; i < N; i++) {
  const r = Math.pow(Math.random(), 0.6) * 2.4;
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  positions[i*3+0] = r * Math.sin(phi) * Math.cos(theta) * 1.45;
  positions[i*3+1] = r * Math.cos(phi) * 0.85;
  positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta) * 0.85;
  seeds[i] = Math.random();
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geo.setAttribute('aSeed',    new THREE.Float32BufferAttribute(seeds, 1));

// -------- Shaders --------
const VERT = `
uniform float uTime;
uniform float uFlowTime;
uniform float uLow;
uniform float uMid;
uniform float uHigh;
uniform float uPulse;
uniform float uPhase;

attribute float aSeed;

varying float vBright;
varying float vDepth;

vec3 mod289v3(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289v4(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289v4(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289v3(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0)) +
    i.y + vec4(0.0, i1.y, i2.y, 1.0)) +
    i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0*x_);
  vec4 x = x_*ns.x + ns.yyyy;
  vec4 y = y_*ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m*m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
vec3 snoiseVec3(vec3 x){
  return vec3(
    snoise(x),
    snoise(vec3(x.y - 19.1, x.z + 33.4, x.x + 47.2)),
    snoise(vec3(x.z + 74.2, x.x - 124.5, x.y + 99.4))
  );
}
vec3 curlNoise(vec3 p){
  const float e = 0.1;
  vec3 dx = vec3(e, 0.0, 0.0);
  vec3 dy = vec3(0.0, e, 0.0);
  vec3 dz = vec3(0.0, 0.0, e);
  vec3 px0 = snoiseVec3(p - dx); vec3 px1 = snoiseVec3(p + dx);
  vec3 py0 = snoiseVec3(p - dy); vec3 py1 = snoiseVec3(p + dy);
  vec3 pz0 = snoiseVec3(p - dz); vec3 pz1 = snoiseVec3(p + dz);
  float xg = py1.z - py0.z - pz1.y + pz0.y;
  float yg = pz1.x - pz0.x - px1.z + px0.z;
  float zg = px1.y - px0.y - py1.x + py0.x;
  return normalize(vec3(xg, yg, zg));
}

void main(){
  vec3 pos = position;

  vec3 flow  = curlNoise(pos * 0.5 + vec3(uFlowTime*0.35, uFlowTime*0.27, uFlowTime*0.31) + vec3(uPhase*0.4));
  vec3 flow2 = curlNoise(pos * 1.15 + vec3(uFlowTime*0.55 + 5.0, uFlowTime*0.42, uFlowTime*0.60));

  float orderedAmp = 0.22 + uMid * 0.55 + uLow * 0.35 + uHigh * 0.15;
  vec3 ordered = flow * orderedAmp + flow2 * (orderedAmp * 0.35);

  vec3 shimmer = vec3(
    snoise(vec3(pos.x*1.6, pos.y*1.6, uFlowTime*1.4)),
    snoise(vec3(pos.y*1.6, pos.z*1.6, uFlowTime*1.7 + 3.0)),
    snoise(vec3(pos.z*1.6, pos.x*1.6, uFlowTime*1.3 + 7.0))
  ) * uHigh * 0.22;

  vec3 rnd = vec3(
    snoise(vec3(pos.x*0.5, pos.y*0.5, uTime*1.2)),
    snoise(vec3(pos.y*0.5, pos.z*0.5, uTime*1.5 + 3.0)),
    snoise(vec3(pos.z*0.5, pos.x*0.5, uTime*1.1 + 7.0))
  );
  vec3 chaos = rnd * (uPulse * 1.20);

  float expansion = 1.0 + uLow * 0.25 + uPulse * 0.30;
  vec3 basePos = pos * expansion;

  pos = basePos + ordered + shimmer + chaos;

  vec4 mv = modelViewMatrix * vec4(pos, 1.0);
  gl_Position = projectionMatrix * mv;

  float size = 1.0 + uLow * 0.7 + uPulse * 2.4 + aSeed * 0.7;
  gl_PointSize = size * (16.0 / -mv.z);

  float glow = 0.35 + aSeed * 0.35;
  glow += uPulse * (0.4 + 0.6 * aSeed);
  glow += uMid * 0.20 * aSeed;
  vBright = glow;
  vDepth  = -mv.z;
}
`;

const FRAG = `
precision highp float;
uniform vec3 uColor;
varying float vBright;
varying float vDepth;

void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c);
  if (d > 0.5) discard;
  float alpha = smoothstep(0.50, 0.05, d) * 0.55;
  float depthFade = clamp(1.0 - (vDepth - 5.0) / 15.0, 0.25, 1.0);
  /* paleta derivada del color del servicio (uColor): versión oscura →
     el color vivo tal cual → versión pálida hacia blanco, MISMA
     progresión tonal que el azul original (navy → edge blue → pale
     blue), ahora agnóstica de matiz. */
  vec3 baseCol = uColor * 0.30;
  vec3 edgeCol = uColor;
  vec3 hotCol  = mix(uColor, vec3(1.0), 0.55);
  float b = min(1.0, vBright);
  vec3 col = mix(baseCol, edgeCol, smoothstep(0.10, 0.75, b));
  col = mix(col, hotCol, smoothstep(0.75, 1.20, b));
  gl_FragColor = vec4(col * (0.7 + 0.5 * b) * depthFade, alpha);
}
`;

const uniforms = {
  uTime:     { value: 0 },
  uFlowTime: { value: 0 },
  uLow:      { value: 0 },
  uMid:      { value: 0 },
  uHigh:     { value: 0 },
  uPulse:    { value: 0 },
  uPhase:    { value: 0 },
  uColor:    { value: new THREE.Color(0x33a0ff) }, // azul de respaldo hasta que la página madre llame dustSetColor
};

/* dustSetColor(hex) — llamada por la página madre con el color del
   servicio ('#E15CDB', etc.) apenas monta la galería, para que el
   efecto nazca ya en el tono correcto (no solo al reproducir). */
window.dustSetColor = function dustSetColor(hex) {
  try { uniforms.uColor.value.set(hex); } catch (_) {}
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader:   VERT,
  fragmentShader: FRAG,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const points = new THREE.Points(geo, mat);
scene.add(points);

// -------- Audio --------
/* STREAMING, no descarga completa (fix 2026-07-18: "las pistas tardan
   siglos en cargar" — la versión anterior bajaba el mp3 ENTERO con
   fetch() y lo decodificaba completo con decodeAudioData() ANTES de
   poder arrancar; para un archivo de 5-7MB eso son varios segundos de
   nada. Un <audio> real + MediaElementAudioSourceNode reproduce
   PROGRESIVO — el navegador arranca en cuanto bufferea los primeros
   segundos, igual que cualquier reproductor de streaming, y el resto
   sigue bajando en paralelo mientras suena. */
let actx = null, analyser = null, freq = null;
let audioEl = null, currentSrcNode = null;
let silentAudio = null;
let playToken = 0; // descarta un dustPlay viejo si llega uno nuevo antes de que arranque
const prevSpec = new Float32Array(80);
let fluxAvg = 0;
let beatPulse = 0;
let beatPhase = 0;
let lastBeatTime = 0;

const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

/* dustPlay(url) — llamada SÍNCRONA desde el click de la página madre
   (mismo-origen: window.frames[...].dustPlay(url)) para conservar el
   gesto del usuario que requieren AudioContext/HTMLMediaElement en
   navegadores móviles. Arranca el audio EN STREAMING y avisa
   'dust-started'/'dust-ended'/'dust-error' al padre. */
window.dustPlay = async function dustPlay(url) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (!silentAudio) {
      silentAudio = new Audio(SILENT_WAV);
      silentAudio.loop = true;
      silentAudio.playsInline = true;
      silentAudio.setAttribute('playsinline', 'true');
      silentAudio.setAttribute('webkit-playsinline', 'true');
    }
    /* corta la pista actual DE INMEDIATO (bug 2026-07-18: "no para,
       sigue hasta que termina la anterior") */
    if (audioEl) { try { audioEl.pause(); audioEl.onended = null; audioEl.src = ''; } catch (_) {} audioEl = null; }
    const myToken = ++playToken;

    silentAudio.play().catch(() => {});
    if (actx.state === 'suspended') await actx.resume();

    if (!analyser) {
      analyser = actx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.5;
      freq = new Uint8Array(analyser.frequencyBinCount);
      analyser.connect(actx.destination);
    }
    /* fuga de memoria (reporte 2026-07-18 "sigue colapsando el
       navegador"): cada pista crea un <audio> + MediaElementSourceNode
       NUEVO, y el nodo de la pista anterior se quedaba conectado al
       grafo para siempre — WebAudio no libera un nodo mientras siga
       alcanzable desde destination, así que cada cambio de pista sumaba
       un <audio> muerto permanente. Se desconecta el nodo anterior
       antes de crear el nuevo. */
    if (currentSrcNode) { try { currentSrcNode.disconnect(); } catch (_) {} currentSrcNode = null; }

    const el = new Audio();
    el.crossOrigin = 'anonymous';
    el.preload = 'auto';
    el.src = url;
    /* createMediaElementSource SOLO se puede llamar una vez por
       elemento — cada pista usa un <audio> nuevo, así que siempre es
       la primera vez. */
    const srcNode = actx.createMediaElementSource(el);
    currentSrcNode = srcNode;
    srcNode.connect(analyser);
    el.addEventListener('ended', () => {
      if (myToken !== playToken) return;
      audioEl = null;
      notifyParent({ type: 'dust-ended' });
    });
    el.addEventListener('error', () => {
      if (myToken !== playToken) return;
      notifyParent({ type: 'dust-error', message: 'no se pudo cargar el audio' });
    });
    /* 'canplay' dispara en cuanto hay suficiente buffer para arrancar
       sin cortes — no espera el archivo completo. */
    el.addEventListener('canplay', () => {
      if (myToken !== playToken) return; // el usuario ya eligió otra pista mientras esta cargaba
      audioEl = el;
      el.play().catch(() => {});
      notifyParent({ type: 'dust-started', duration: el.duration });
    }, { once: true });
    el.load();
  } catch (e) {
    notifyParent({ type: 'dust-error', message: String(e && e.message || e) });
  }
};

window.dustStop = function dustStop() {
  playToken++; // invalida cualquier dustPlay en vuelo para que no arranque después de este stop
  if (audioEl) { try { audioEl.pause(); audioEl.onended = null; audioEl.src = ''; } catch (_) {} audioEl = null; }
  if (currentSrcNode) { try { currentSrcNode.disconnect(); } catch (_) {} currentSrcNode = null; }
  if (silentAudio) { try { silentAudio.pause(); } catch (_) {} }
};

// -------- Render loop --------
const t0 = performance.now();
let camAngle = 0;
let lastFrameMs = t0;
let flowTime = 0;
/* PAUSA REAL del loop (fix 2026-07-18: "cuando está corriendo empieza a
   colapsar todas las otras pestañas del browser" — el <iframe> queda
   SIEMPRE en el DOM aunque la página madre oculte el panel de música
   con CSS display:none, y display:none en un ancestro NO detiene el
   requestAnimationFrame del iframe: seguía renderizando 22k partículas
   a 60fps en segundo plano indefinidamente, sin que el usuario lo
   viera, consumiendo GPU sin parar mientras dure la visita a la
   página. dustPause()/dustResume() los llama la página madre al
   cerrar/abrir el panel; document.hidden autopausa si se cambia de
   pestaña del navegador, por si algo se le escapa a la página madre. */
let rafId = null;
let paused = false;
window.dustPause = function dustPause() {
  if (paused) return;
  paused = true;
  if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
};
window.dustResume = function dustResume() {
  if (!paused) return;
  paused = false;
  lastFrameMs = performance.now();
  rafId = requestAnimationFrame(tick);
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) window.dustPause(); else window.dustResume();
});
function tick(){
  rafId = requestAnimationFrame(tick);
  const now = performance.now();
  const tSec = (now - t0) / 1000;
  const dt = Math.min(0.05, Math.max(0, (now - lastFrameMs) / 1000));
  lastFrameMs = now;

  let lo = 0, mi = 0, hi = 0;
  if (analyser && freq){
    analyser.getByteFrequencyData(freq);
    const avg = (s, e) => {
      let sum = 0;
      const n = Math.min(e, freq.length);
      for (let j = s; j < n; j++) sum += freq[j];
      return (sum / Math.max(1, n - s)) / 255;
    };
    lo = Math.min(1.5, avg(0,   80)  * 0.7);
    mi = Math.min(1.5, avg(80,  200) * 0.7);
    hi = Math.min(1.5, avg(200, 400) * 0.7);

    let fluxSum = 0;
    const BANDS = Math.min(80, freq.length);
    for (let i = 2; i < BANDS; i++){
      const cur = freq[i] / 255;
      const d = cur - prevSpec[i];
      if (d > 0) fluxSum += d;
      prevSpec[i] = cur;
    }
    const flux = fluxSum / BANDS;
    fluxAvg = fluxAvg * 0.95 + flux * 0.05;

    const sinceBeat = now - lastBeatTime;
    if (sinceBeat > 120 && flux > fluxAvg * 1.5 + 0.003){
      const strength = Math.min(1.0, (flux - fluxAvg) * 22.0);
      if (strength > 0.20){
        beatPulse = Math.max(beatPulse, strength);
        beatPhase += 0.8 + Math.random() * 2.4;
        lastBeatTime = now;
      }
    }
    beatPulse *= 0.88;
    if (beatPulse < 0.001) beatPulse = 0;
  } else {
    beatPulse *= 0.92;
  }

  const envelope = lo * 0.5 + mi * 0.35 + hi * 0.15;
  flowTime += dt * (0.6 + envelope * 2.6);

  camAngle += 0.0025 + beatPulse * 0.008;
  camera.position.x = Math.sin(camAngle) * 8.5;
  camera.position.z = Math.cos(camAngle) * 8.5;
  camera.position.y = Math.sin(camAngle * 0.4) * 0.8;
  camera.lookAt(0, 0, 0);

  uniforms.uTime.value     = tSec;
  uniforms.uFlowTime.value = flowTime;
  uniforms.uLow.value   = lo;
  uniforms.uMid.value   = mi;
  uniforms.uHigh.value  = hi;
  uniforms.uPulse.value = beatPulse;
  uniforms.uPhase.value = beatPhase;

  renderer.render(scene, camera);
}
tick();
notifyParent({ type: 'dust-ready' });
</script>
</body>
</html>
